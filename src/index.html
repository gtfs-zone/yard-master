<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>manage.rt.gtfs.zone - Feed Manager</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>

  <body class="font-sans h-screen overflow-hidden">
    <div class="app-container h-screen grid grid-rows-[auto_1fr]">
      <!-- Navbar -->
      <div class="navbar bg-base-100 col-span-2 border-b border-base-300 z-50">
        <div class="navbar-start">
          <a href="https://gtfs.zone" class="flex items-center gap-3" target="_blank" rel="noopener noreferrer">
            <div class="avatar">
              <div class="w-8 rounded-lg"><img src="logo.svg" alt="manage.rt.gtfs.zone logo" /></div>
            </div>
            <h1 class="text-xl font-bold hidden md:block">
              <span class="text-primary">manage</span>.rt.gtfs.zone<sup id="app-version" class="text-xs opacity-50 font-normal ml-1"></sup>
            </h1>
          </a>
        </div>
        <div class="navbar-end">
          <div class="flex items-center gap-2">
            <!-- The calendar: the month a feed runs, and who is covering it.
                 The badge counts today's assignments once they are loaded. -->
            <div class="indicator">
              <span id="calendar-count" class="indicator-item badge badge-primary badge-xs hidden tabular-nums"></span>
              <button id="calendar-btn" class="btn btn-ghost btn-sm btn-square" title="Calendar">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
                </svg>
              </button>
            </div>
            <!-- Sharing: who manages this feed, and who has been invited. -->
            <button id="share-btn" class="btn btn-ghost btn-sm btn-square" title="Share">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z" />
              </svg>
            </button>
            <!-- Every managed alert on this feed. The badge counts them. -->
            <div class="indicator">
              <span id="alerts-badge" class="indicator-item badge badge-error badge-xs hidden tabular-nums"></span>
              <button id="alerts-btn" class="btn btn-ghost btn-sm btn-square" title="Service alerts">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
              </button>
            </div>
            <label class="swap swap-rotate btn btn-ghost btn-sm btn-circle">
              <input type="checkbox" class="theme-controller" value="light" />
              <svg class="swap-on h-5 w-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
              </svg>
              <svg class="swap-off h-5 w-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z" />
              </svg>
            </label>
            <button id="about-btn" class="btn btn-ghost btn-sm btn-square" title="About">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </button>
            <!-- The signed-in person, labelled with their own name or address.
                 href and visibility come from /api/me's account_url at boot.
                 A new tab, like cafe-car's own account page: Keycloak's console
                 is a different origin with no link back, so navigating there in
                 this tab strands the map. -->
            <a id="user-btn" class="btn btn-ghost btn-sm hidden" href="#"
               target="_blank" rel="noopener noreferrer"></a>
            <!-- The feed switcher: your feeds only, plus New feed. Last, and
                 the only primary button, the way [Load] is in the upstreams. -->
            <button id="feed-switcher-btn" class="btn btn-primary btn-sm">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
              </svg>
              <span id="feed-switcher-label" class="hidden md:inline">Select feed</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Map area -->
      <div class="relative bg-base-300 min-h-0">
        <div id="map" class="w-full h-full"></div>
        <div id="map-controls" class="absolute top-2 left-2 right-2 z-40 flex flex-row items-start gap-2 pointer-events-none">
          <div id="map-search-card" class="relative flex-1 max-w-sm card card-bordered bg-base-100 shadow-lg p-2 pointer-events-auto">
            <input type="text" id="map-search" placeholder="Search" class="input input-sm w-full" />
          </div>
        </div>
      </div>

      <!-- Right panel: the browse tree and every properties page -->
      <div id="right-panel" class="right-panel relative bg-base-200 border-l border-base-300 flex flex-col overflow-hidden min-h-0">
        <div id="sheet-top-handle" class="md:hidden flex justify-center items-center py-2 cursor-grab active:cursor-grabbing flex-shrink-0">
          <div class="w-10 h-1 rounded-full bg-base-content/20"></div>
        </div>
        <div id="panel-resizer" class="hidden md:block absolute left-0 top-0 bottom-0 w-2 cursor-col-resize z-10 group">
          <div class="absolute inset-y-0 left-0.5 w-px bg-base-300 group-hover:bg-primary/50 transition-colors"></div>
        </div>
        <div id="panel-content" class="panel-scroll flex-1 overflow-y-auto bg-base-100 p-4">
          <p class="text-base-content/50 text-sm text-center py-8">No feed selected</p>
        </div>
      </div>
    </div>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
